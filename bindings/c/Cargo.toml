[package]
name = "anybox-capi"
version = "0.9.0"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
authors = ["ethereal"]
description = "the C ABI over anybox"
repository = "https://github.com/etherealrl/anybox"
publish = false

[lib]
name = "anybox"
crate-type = ["cdylib", "staticlib"]

[lints.clippy]
all = { level = "warn", priority = -1 }
# the header says once, at the top, what every pointer has to be
missing_safety_doc = "allow"

[features]
# the Medius mock surface, for testing code that uses anybox without a box
mock = ["anybox-rs/mock", "medius-capi/mock"]
trace = ["anybox-rs/trace"]

[dependencies]
anybox-rs = { path = "../.." }
medius-capi = "=3.4.6"

[dev-dependencies]
# the conformance suite's scenarios and what it records are JSON, so every language can read them
serde_json = "1"
# reads the medius crate's source for what a binding has to mirror
syn = { version = "3", features = ["full"] }
# the Medius suite runs the crate's own helpers, the same version medius-capi pins
medius = { version = "=3.4.6", features = ["mock"] }
