[package]
name = "anybox-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
authors = ["ethereal"]
description = "one API for the most popular passthrough boxes"
repository = "https://github.com/etherealrl/anybox"
readme = "README.md"
keywords = ["mouse", "keyboard", "hid", "medius", "makcu"]
categories = ["hardware-support", "api-bindings"]
include = ["/src/**/*.rs", "/docs/**", "/README.md", "/LICENSE", "/NOTICE"]

[lib]
name = "anybox"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[features]
default = ["medius", "makcu"]
medius = ["dep:medius"]
makcu = []

[dependencies]
medius = { version = "=3.4.3", optional = true }
serial2 = { version = "0.2.38", features = ["windows"] }
serialport = "4.10"
thiserror = "2"

[dev-dependencies]
medius = { version = "=3.4.3", features = ["mock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_Communication", "Win32_System_IO", "Win32_System_Threading", "Win32_Security"] }
