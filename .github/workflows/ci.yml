name: ci

# a push only runs on the public repo, the private one pays for its minutes (Windows counts double) and
# its hooks already run the same checks, so there it only runs when someone asks
on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  check:
    if: github.event_name != 'push' || github.repository == 'etherealrl/anybox'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # serialport reads USB ids through libudev on Linux
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      # rustup reads rust-toolchain.toml and installs the pinned stable with rustfmt and clippy
      - run: rustup show active-toolchain
      # the header check needs cbindgen, pinned because its output changes between versions
      - if: runner.os == 'Linux'
        run: cargo install cbindgen --version 0.29.4 --locked
      # check.sh runs the Python tests through uv, which fetches the Pythons it needs
      - run: python -m pip install uv
      - run: bash scripts/check.sh
        shell: bash
      # cl is only on the path inside a developer prompt, so the C smoke test gets one here
      - if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          rem a bare bash could be WSL's from System32
          "%ProgramFiles%\Git\bin\bash.exe" scripts/test-c.sh
      # the oldest Rust the crate says it builds on, and each box family on its own like the README offers
      - if: runner.os == 'Linux'
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --workspace --all-features
          cargo clippy --no-default-features --features medius --all-targets -- -D warnings
          cargo clippy --no-default-features --features makcu --all-targets -- -D warnings
          cargo clippy --no-default-features --features ferrum --all-targets -- -D warnings
          cargo clippy --no-default-features --features ysc8k --all-targets -- -D warnings
